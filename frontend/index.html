<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aether Platform — 本地优先的知识原子与主动连接发现平台" />
    <title>Aether Platform</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash of the wrong theme.
      ;(function () {
        try {
          var s = JSON.parse(localStorage.getItem('aether.settings.v1') || '{}')
          var mode = s.themeMode || 'system'
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
          document.documentElement.setAttribute('data-accent', s.accent || 'indigo')
          document.documentElement.setAttribute('data-density', s.density || 'comfortable')
          document.documentElement.setAttribute('lang', s.language === 'en' ? 'en' : 'zh-CN')
          if (window.aether && window.aether.material && window.aether.material !== 'none') {
            document.documentElement.setAttribute('data-material', window.aether.material)
          }
          if (s.reduceMotion) document.documentElement.setAttribute('data-reduce-motion', 'true')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
