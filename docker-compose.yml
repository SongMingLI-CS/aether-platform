services:
  mysql:
    image: mysql:8.0
    container_name: aether-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-aether-dev-password}
      MYSQL_DATABASE: aether_db
    ports:
      - "3306:3306"
    volumes:
      - aether-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    container_name: aether-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/aether_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-aether-dev-password}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  frontend:
    build: ./frontend
    container_name: aether-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:80"

  # --- Optional local AI services (Epic 2 real providers) ---------------------
  # Start them together with: docker compose --profile ai up
  # Then set AETHER_EMBEDDING_PROVIDER=ollama / AETHER_VECTORSTORE_PROVIDER=qdrant.
  ollama:
    image: ollama/ollama
    profiles: [ai]
    container_name: aether-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - aether-ollama-data:/root/.ollama

  qdrant:
    image: qdrant/qdrant
    profiles: [ai]
    container_name: aether-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - aether-qdrant-data:/qdrant/storage

volumes:
  aether-mysql-data:
  aether-ollama-data:
  aether-qdrant-data:
