spring.application.name=aether-backend

# ======================================
# Server
# ======================================
server.port=${SERVER_PORT:8080}

# ======================================
# Datasource (MySQL)
# NOTE: NO secrets live in this file. Provide them via environment variables:
#   DB_URL / DB_USERNAME / DB_PASSWORD
# See .env.example and the README for details.
# ======================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aether_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ======================================
# JPA
# ======================================
# Schema is fully managed by Flyway migrations (resources/db/migration);
# Hibernate only validates against the existing schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
